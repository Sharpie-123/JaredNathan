<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0b11">
<title>SWAP — Jared × Nathan</title>
<style>
  :root{
    --bg:#0a0b11;
    --card:rgba(255,255,255,.045);
    --card-2:rgba(255,255,255,.03);
    --line:rgba(255,255,255,.09);
    --line-2:rgba(255,255,255,.06);
    --txt:#eef0f6;
    --dim:#8b90a3;
    --dimmer:#5f6478;
    --gold:#ffc24d;
    --gold-2:#ff8a3d;
    --violet:#a78bfa;
    --violet-2:#6d5cff;
    --good:#4ade80;
    --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,monospace;
    --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg);
    background-image:
      radial-gradient(900px 500px at 12% -8%, rgba(255,194,77,.13), transparent 62%),
      radial-gradient(900px 520px at 92% 2%, rgba(109,92,255,.16), transparent 62%);
    background-attachment:fixed;
    color:var(--txt);
    font-family:var(--sans);
    line-height:1.45;
    min-height:100vh;
    padding:20px 16px 56px;
    padding-bottom:calc(56px + env(safe-area-inset-bottom));
  }
  .wrap{max-width:940px;margin:0 auto}

  /* ---------- header ---------- */
  header{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:20px}
  .brand{display:flex;align-items:center;gap:10px}
  .brand .mark{
    width:38px;height:38px;border-radius:11px;display:grid;place-items:center;font-size:19px;
    background:linear-gradient(140deg,var(--gold),var(--violet-2));box-shadow:0 6px 20px rgba(109,92,255,.35)
  }
  .brand h1{margin:0;font-size:25px;letter-spacing:-.6px;font-weight:850}
  .brand small{display:block;color:var(--dim);font-size:11.5px;font-weight:600;letter-spacing:.9px;text-transform:uppercase;margin-top:1px;white-space:nowrap}
  .reset{
    flex:none;white-space:nowrap;
    background:transparent;border:1px solid var(--line);color:var(--dimmer);
    font:600 11.5px/1 var(--sans);letter-spacing:.6px;text-transform:uppercase;
    padding:9px 13px;border-radius:999px;cursor:pointer;transition:.15s
  }
  .reset:hover{color:var(--txt);border-color:rgba(255,255,255,.22)}

  /* ---------- generic card ---------- */
  .card{background:var(--card);border:1px solid var(--line);border-radius:20px}
  .eyebrow{font:800 10.5px/1 var(--sans);letter-spacing:1.6px;text-transform:uppercase;color:var(--dimmer)}

  /* ---------- trade card ---------- */
  .trade{padding:18px 16px 16px;margin-bottom:22px;position:relative;overflow:hidden}
  .trade::before{
    content:"";position:absolute;inset:0 0 auto;height:1px;
    background:linear-gradient(90deg,transparent,var(--gold),var(--violet),transparent);opacity:.65
  }
  .trade-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
  .live{display:flex;align-items:center;gap:6px;font:700 10.5px/1 var(--sans);letter-spacing:1px;color:var(--dim);text-transform:uppercase}
  .dot{width:6px;height:6px;border-radius:50%;background:var(--good);box-shadow:0 0 8px var(--good);animation:pulse 2s infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}

  .versus{display:grid;grid-template-columns:1fr auto 1fr;gap:14px;align-items:stretch}
  .vs{
    align-self:center;font:900 12px/1 var(--sans);letter-spacing:.5px;color:var(--dimmer);
    border:1px solid var(--line);border-radius:999px;padding:9px 7px;background:var(--bg)
  }
  .side{
    background:var(--card-2);border:1px solid var(--line-2);border-radius:16px;padding:14px;
    display:flex;flex-direction:column;gap:11px;transition:border-color .2s
  }
  .side.lead{border-color:rgba(255,255,255,.16)}
  .who{display:flex;align-items:center;gap:9px}
  .ava{
    width:33px;height:33px;border-radius:10px;display:grid;place-items:center;font-size:16px;flex:none;
    background:rgba(255,255,255,.06);border:1px solid var(--line)
  }
  .j .ava{box-shadow:inset 0 0 0 1px rgba(255,194,77,.35)}
  .n .ava{box-shadow:inset 0 0 0 1px rgba(167,139,250,.35)}
  .who b{font-size:15px;letter-spacing:-.2px;display:flex;align-items:center;gap:6px}
  .who span{display:block;font-size:11px;color:var(--dimmer);font-weight:600}
  .crown{font-size:13px;filter:drop-shadow(0 0 6px rgba(255,194,77,.6))}

  .now{font-size:11px;color:var(--dim);font-weight:600}
  .book-title{font-size:17.5px;font-weight:800;letter-spacing:-.3px;margin:-4px 0 0}
  .j .book-title{color:var(--gold)}
  .n .book-title{color:var(--violet)}

  .meter{margin-top:2px}
  .meter-top{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-bottom:7px}
  .pct{font:800 26px/1 var(--mono);letter-spacing:-1.5px}
  .j .pct{color:var(--gold)}
  .n .pct{color:var(--violet)}
  .unit{font:600 11.5px/1.3 var(--mono);color:var(--dim);text-align:right}
  .bar{height:9px;border-radius:99px;background:rgba(255,255,255,.07);overflow:hidden}
  .fill{display:block;height:100%;border-radius:99px;width:0;min-width:9px;transition:width .45s cubic-bezier(.34,1.3,.5,1)}
  .j .fill{background:linear-gradient(90deg,var(--gold-2),var(--gold))}
  .n .fill{background:linear-gradient(90deg,var(--violet-2),var(--violet))}
  .ticks{display:flex;gap:3px;margin-top:7px}
  .tick{display:block;flex:1;height:3px;border-radius:2px;background:rgba(255,255,255,.08)}
  .tick.on{background:rgba(255,255,255,.4)}

  .acts{display:flex;gap:7px;margin-top:auto;padding-top:4px;flex-wrap:wrap}
  button{font-family:var(--sans)}
  .btn{
    flex:1;min-width:0;border:0;border-radius:11px;padding:11px 10px;cursor:pointer;
    font-size:13px;font-weight:750;letter-spacing:-.1px;color:#15161d;transition:transform .1s,filter .15s
  }
  .btn:active{transform:scale(.97)}
  .j .btn{background:linear-gradient(180deg,var(--gold),#f0a92e)}
  .n .btn{background:linear-gradient(180deg,var(--violet),#8b6df5);color:#12101d}
  .btn:hover{filter:brightness(1.08)}
  .btn.ghost{
    flex:0 0 auto;width:42px;background:transparent;border:1px solid var(--line);
    color:var(--dim);font-size:15px;font-weight:700;padding:11px 0
  }
  .btn.ghost:hover{color:var(--txt);border-color:rgba(255,255,255,.24)}
  .btn:disabled{opacity:.35;cursor:not-allowed;filter:none}

  /* ---------- verdict ---------- */
  .verdict{margin-top:15px;border-top:1px dashed var(--line);padding-top:14px}
  .race{display:flex;height:7px;border-radius:99px;overflow:hidden;background:rgba(255,255,255,.06);margin-bottom:11px}
  .race i{display:block;height:100%;transition:width .45s cubic-bezier(.34,1.3,.5,1)}
  .race .rj{background:linear-gradient(90deg,var(--gold-2),var(--gold))}
  .race .rn{background:linear-gradient(90deg,var(--violet),var(--violet-2));margin-left:auto}
  .talk{display:flex;align-items:center;gap:11px}
  .talk p{margin:0;font-size:13.5px;color:var(--txt);flex:1;font-weight:550}
  .talk p b{font-weight:800}
  .talk p .g{color:var(--gold)}
  .talk p .v{color:var(--violet)}
  .taunt{
    flex:none;background:rgba(255,255,255,.05);border:1px solid var(--line);color:var(--dim);
    border-radius:10px;padding:8px 11px;font-size:12.5px;font-weight:700;cursor:pointer;transition:.15s
  }
  .taunt:hover{color:var(--txt);border-color:rgba(255,255,255,.24)}
  .taunt:active{transform:scale(.95)}

  /* ---------- shelves ---------- */
  .shelves{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:start}
  .shelf{padding:15px 14px 13px}
  .shelf-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
  .shelf-head .eyebrow span{color:var(--dim)}
  .count{font:700 11px/1 var(--mono);color:var(--dimmer)}
  ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:9px}
  li{background:var(--card-2);border:1px solid var(--line-2);border-radius:13px;padding:11px 12px}
  li.active{border-color:rgba(255,255,255,.16);background:rgba(255,255,255,.05)}
  .row1{display:flex;align-items:flex-start;justify-content:space-between;gap:9px}
  .bt{font-size:14px;font-weight:750;letter-spacing:-.2px;margin:0}
  .sub{font-size:11px;color:var(--dimmer);font-weight:600;margin:2px 0 0}
  .pill{
    flex:none;font:700 9.5px/1 var(--sans);letter-spacing:.9px;text-transform:uppercase;
    padding:5px 8px;border-radius:99px;border:1px solid transparent;white-space:nowrap
  }
  .pill.fin{background:rgba(74,222,128,.12);color:var(--good);border-color:rgba(74,222,128,.25)}
  .pill.read{background:rgba(255,255,255,.07);color:var(--dim);border-color:var(--line)}
  .pill.swap{background:linear-gradient(90deg,rgba(255,194,77,.16),rgba(167,139,250,.16));color:#f0d9a8;border-color:rgba(255,194,77,.28)}
  .row2{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:9px}
  .stars{display:flex;gap:1px;background:none;border:0;padding:0;cursor:pointer}
  .stars b{
    font-size:15px;line-height:1;color:rgba(255,255,255,.16);padding:2px 1px;transition:color .12s;font-weight:400
  }
  .stars b.on{color:var(--gold)}
  .stars:hover b{color:rgba(255,194,77,.4)}
  .stars b.on{color:var(--gold)}
  .rate-hint{font:600 10px/1 var(--sans);color:var(--dimmer);letter-spacing:.4px}
  .mini{
    background:rgba(255,255,255,.05);border:1px solid var(--line);color:var(--dim);
    border-radius:9px;padding:7px 10px;font-size:11.5px;font-weight:700;cursor:pointer;transition:.15s;white-space:nowrap
  }
  .mini:hover{color:var(--txt);border-color:rgba(255,255,255,.24)}
  .mini:active{transform:scale(.96)}
  .mini.done{color:var(--good);border-color:rgba(74,222,128,.28)}

  footer{margin-top:22px;text-align:center;font-size:11.5px;color:var(--dimmer);font-weight:600}

  @media (max-width:640px){
    body{padding:16px 12px 44px}
    .versus{grid-template-columns:1fr;gap:10px}
    .vs{justify-self:center;padding:6px 14px}
    .shelves{grid-template-columns:1fr}
    .brand h1{font-size:22px}
    .pct{font-size:24px}
    .brand small{font-size:10.5px;letter-spacing:.5px}
    .brand small .long{display:none}
    .reset{padding:9px 11px;font-size:11px}
  }
  @media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="brand">
      <div class="mark">📚</div>
      <div>
        <h1>SWAP</h1>
        <small>Jared × Nathan<span class="long"> · trade #1</span></small>
      </div>
    </div>
    <button class="reset" id="reset">Reset demo</button>
  </header>

  <section class="card trade">
    <div class="trade-head">
      <div class="eyebrow">The Trade</div>
      <div class="live"><i class="dot"></i> in progress</div>
    </div>
    <div class="versus" id="versus"></div>
    <div class="verdict">
      <div class="race"><i class="rj" id="raceJ"></i><i class="rn" id="raceN"></i></div>
      <div class="talk">
        <p id="talk"></p>
        <button class="taunt" id="taunt">💬 Talk trash</button>
      </div>
    </div>
  </section>

  <div class="shelves" id="shelves"></div>

  <footer>Demo only · nothing saved anywhere but this browser</footer>
</div>

<script>
/* ------------------------------------------------------------------ *
 * Static series data (never changes) — page counts are the real ones. *
 * ------------------------------------------------------------------ */
const SERIES = {
  vinland: {
    title: 'Vinland Saga',
    kind: 'manga',
    volumes: 27
  },
  redrising: {
    title: 'Red Rising',
    kind: 'trilogy',
    books: [
      { title: 'Red Rising',  pages: 382 },
      { title: 'Golden Son',  pages: 442 },
      { title: 'Morning Star', pages: 518 }
    ]
  }
};
const RR_TOTAL = SERIES.redrising.books.reduce((n, b) => n + b.pages, 0);

const PEOPLE = {
  jared:  { name: 'Jared',  tag: 'you',        emoji: '🦊', cls: 'j' },
  nathan: { name: 'Nathan', tag: 'best friend', emoji: '🐺', cls: 'n' }
};

/* Fresh demo state */
function seed() {
  return {
    // the swap: Jared reads Vinland Saga, Nathan reads Red Rising from book 1
    trade: {
      jared:  { volume: 2 },                 // vol 2 of 27
      nathan: { book: 0, page: 47 }          // book 1, p.47
    },
    shelves: {
      jared: [
        { id: 'j1', title: 'Red Rising',   sub: 'Red Rising #1',    status: 'finished', rating: 4 },
        { id: 'j2', title: 'Golden Son',   sub: 'Red Rising #2',    status: 'finished', rating: 5 },
        { id: 'j3', title: 'Morning Star', sub: 'Red Rising #3',    status: 'reading',  rating: 0, page: 210, pages: 518 },
        { id: 'j4', title: 'Vinland Saga', sub: "Nathan's pick",    status: 'reading',  rating: 0, swap: true }
      ],
      nathan: [
        { id: 'n1', title: 'Vinland Saga', sub: 'Vol. 1–27 · complete', status: 'finished', rating: 5 },
        { id: 'n2', title: 'Red Rising',   sub: "Jared's pick",         status: 'reading',  rating: 0, swap: true }
      ]
    },
    taunt: 0
  };
}

const KEY = 'swap-demo-v1';
let S = load();

function load() {
  try {
    const raw = localStorage.getItem(KEY);
    if (!raw) return seed();
    const p = JSON.parse(raw);
    // shallow sanity check so a stale/broken blob can't wedge the demo
    if (!p || !p.trade || !p.shelves || !p.shelves.jared) return seed();
    return p;
  } catch (e) {
    return seed();
  }
}
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { /* private mode: run in memory */ }
}

/* ------------------------------- math ------------------------------- */
function jaredPct() {
  return S.trade.jared.volume / SERIES.vinland.volumes * 100;
}
function nathanPagesRead() {
  const { book, page } = S.trade.nathan;
  let done = 0;
  for (let i = 0; i < book; i++) done += SERIES.redrising.books[i].pages;
  return done + page;
}
function nathanPct() {
  return nathanPagesRead() / RR_TOTAL * 100;
}
const fmt = n => (n < 10 ? n.toFixed(1) : Math.round(n)) + '%';

/* ---------------------------- trade card ---------------------------- */
function tradeSides() {
  const jp = jaredPct(), np = nathanPct();
  const jLead = jp >= np;
  const v = S.trade.jared.volume, VOLS = SERIES.vinland.volumes;
  const { book, page } = S.trade.nathan;
  const cur = SERIES.redrising.books[book];
  const atEnd = page >= cur.pages;
  const lastBook = book === SERIES.redrising.books.length - 1;

  // 27 volume ticks would be noise on mobile; show 9 chunks of 3
  const jTicks = Array.from({ length: 9 }, (_, i) =>
    `<i class="tick ${v >= (i + 1) * 3 ? 'on' : ''}"></i>`).join('');
  const nTicks = SERIES.redrising.books.map((_, i) =>
    `<i class="tick ${i < book || (i === book && atEnd) ? 'on' : ''}"></i>`).join('');

  return `
  <div class="side j ${jLead ? 'lead' : ''}">
    <div class="who">
      <div class="ava">${PEOPLE.jared.emoji}</div>
      <div>
        <b>${PEOPLE.jared.name}${jLead ? ' <span class="crown">👑</span>' : ''}</b>
        <span>${PEOPLE.jared.tag}</span>
      </div>
    </div>
    <div>
      <div class="now">is reading</div>
      <p class="book-title">Vinland Saga</p>
    </div>
    <div class="meter">
      <div class="meter-top">
        <div class="pct">${fmt(jp)}</div>
        <div class="unit">Vol. ${v} / ${VOLS}<br>${VOLS - v} to go</div>
      </div>
      <div class="bar"><i class="fill" style="width:${jp}%"></i></div>
      <div class="ticks">${jTicks}</div>
    </div>
    <div class="acts">
      <button class="btn" data-act="vol+" ${v >= VOLS ? 'disabled' : ''}>
        ${v >= VOLS ? '🏁 Series done' : '+1 volume'}
      </button>
      <button class="btn ghost" data-act="vol-" ${v <= 0 ? 'disabled' : ''} aria-label="minus one volume">−</button>
    </div>
  </div>

  <div class="vs">VS</div>

  <div class="side n ${!jLead ? 'lead' : ''}">
    <div class="who">
      <div class="ava">${PEOPLE.nathan.emoji}</div>
      <div>
        <b>${PEOPLE.nathan.name}${!jLead ? ' <span class="crown">👑</span>' : ''}</b>
        <span>${PEOPLE.nathan.tag}</span>
      </div>
    </div>
    <div>
      <div class="now">is reading</div>
      <p class="book-title">${cur.title}</p>
    </div>
    <div class="meter">
      <div class="meter-top">
        <div class="pct">${fmt(np)}</div>
        <div class="unit">Book ${book + 1} / 3 · p.${page}<br>${nathanPagesRead()} / ${RR_TOTAL} pages</div>
      </div>
      <div class="bar"><i class="fill" style="width:${np}%"></i></div>
      <div class="ticks">${nTicks}</div>
    </div>
    <div class="acts">
      ${atEnd && !lastBook
        ? `<button class="btn" data-act="nextbook">Start book ${book + 2} →</button>`
        : `<button class="btn" data-act="pg+" ${atEnd ? 'disabled' : ''}>${atEnd ? '🏁 Trilogy done' : '+25 pages'}</button>`}
      <button class="btn ghost" data-act="pg-" ${page <= 0 && book === 0 ? 'disabled' : ''} aria-label="minus 25 pages">−</button>
    </div>
  </div>`;
}

/* ------------------------------ trash talk ------------------------------ */
/* {L} = leader, {T} = trailer. Non-tied lines are continuations of
   "<name> leads by N pts — ", so they start lowercase. */
const TAUNTS = {
  blowout: [
    'this stopped being a race.',
    'at this pace <b>{T}</b> will finish around the heat death of the universe.',
    '<b>{L}</b> could start over and still win.'
  ],
  clear: [
    '<b>{T}</b> has some excuses to prepare.',
    '<b>{T}</b> keeps saying "I read at night." Do you though?',
    '<b>{T}</b> has a bookmark and good intentions.'
  ],
  close: [
    'one long bus ride decides this.',
    '<b>{T}</b> is one chapter from taking it back.',
    'too close to trash talk. Read faster and earn it.'
  ],
  tied: [
    'Dead even. Somebody do something.',
    'Perfectly tied — suspiciously coordinated.',
    'A tie. You are both equally slow.'
  ]
};
function bucket(gap) {
  if (gap < 0.5) return 'tied';
  if (gap < 6) return 'close';
  if (gap < 20) return 'clear';
  return 'blowout';
}
function renderTalk() {
  const jp = jaredPct(), np = nathanPct();
  const gap = Math.abs(jp - np);
  const leadJ = jp >= np;
  const pool = TAUNTS[bucket(gap)];
  let line = pool[S.taunt % pool.length]
    .replace('{L}', leadJ ? 'Jared' : 'Nathan')
    .replace('{T}', leadJ ? 'Nathan' : 'Jared');
  // colorize the names after substitution
  line = line.replace(/<b>Jared<\/b>/g, '<b class="g">Jared</b>')
             .replace(/<b>Nathan<\/b>/g, '<b class="v">Nathan</b>');
  const head = gap < 0.5
    ? ''
    : `<b class="${leadJ ? 'g' : 'v'}">${leadJ ? 'Jared' : 'Nathan'}</b> leads by ${gap.toFixed(1)} pts — `;
  document.getElementById('talk').innerHTML = head + line;
  document.getElementById('raceJ').style.width = (jp / 2) + '%';
  document.getElementById('raceN').style.width = (np / 2) + '%';
}

/* ------------------------------- shelves ------------------------------- */
function stars(rating, who, id) {
  const s = [1, 2, 3, 4, 5].map(n =>
    `<b class="${n <= rating ? 'on' : ''}" data-star="${n}">★</b>`).join('');
  return `<button class="stars" data-rate="${who}:${id}" aria-label="rate ${rating} of 5">${s}</button>`;
}
function shelfFor(who) {
  const p = PEOPLE[who];
  const list = S.shelves[who];
  const fin = list.filter(b => b.status === 'finished').length;
  const rated = list.filter(b => b.rating > 0);
  const avg = rated.length ? (rated.reduce((n, b) => n + b.rating, 0) / rated.length).toFixed(1) : '–';

  const items = list.map(b => {
    const pill = b.swap && b.status === 'reading'
      ? '<span class="pill swap">↔ the swap</span>'
      : b.status === 'finished'
        ? '<span class="pill fin">✓ finished</span>'
        : '<span class="pill read">reading</span>';

    // the two swap rows mirror the trade card instead of storing their own progress
    let title = b.title, sub = b.sub;
    if (b.swap && who === 'jared') {
      sub = `${b.sub} · vol. ${S.trade.jared.volume} / ${SERIES.vinland.volumes}`;
    } else if (b.swap && who === 'nathan') {
      const { book, page } = S.trade.nathan;
      title = SERIES.redrising.books[book].title;
      sub = `${b.sub} · book ${book + 1} of 3, p.${page}`;
    } else if (b.status === 'reading' && b.page) {
      sub = `${b.sub} · p.${b.page} / ${b.pages}`;
    }
    return `
      <li class="${b.status === 'reading' ? 'active' : ''}">
        <div class="row1">
          <div>
            <p class="bt">${title}</p>
            <p class="sub">${sub}</p>
          </div>
          ${pill}
        </div>
        <div class="row2">
          ${stars(b.rating, who, b.id)}
          ${b.rating === 0 && b.status === 'finished' ? '<span class="rate-hint">tap to rate</span>' : ''}
          <button class="mini ${b.status === 'finished' ? 'done' : ''}" data-fin="${who}:${b.id}">
            ${b.status === 'finished' ? '↩ Reading again' : '✓ Mark finished'}
          </button>
        </div>
      </li>`;
  }).join('');

  return `
    <section class="card shelf ${p.cls}">
      <div class="shelf-head">
        <div class="eyebrow">${p.emoji} ${p.name}'s shelf</div>
        <div class="count">${fin} done · ★ ${avg}</div>
      </div>
      <ul>${items}</ul>
    </section>`;
}

/* ------------------------------- render ------------------------------- */
function render() {
  document.getElementById('versus').innerHTML = tradeSides();
  document.getElementById('shelves').innerHTML = shelfFor('jared') + shelfFor('nathan');
  renderTalk();
}

/* ------------------------------- actions ------------------------------- */
const clamp = (n, lo, hi) => Math.max(lo, Math.min(hi, n));

function tradeAction(act) {
  const t = S.trade;
  const books = SERIES.redrising.books;
  if (act === 'vol+') t.jared.volume = clamp(t.jared.volume + 1, 0, SERIES.vinland.volumes);
  if (act === 'vol-') t.jared.volume = clamp(t.jared.volume - 1, 0, SERIES.vinland.volumes);
  if (act === 'pg+')  t.nathan.page = clamp(t.nathan.page + 25, 0, books[t.nathan.book].pages);
  if (act === 'pg-') {
    if (t.nathan.page <= 0 && t.nathan.book > 0) {
      t.nathan.book--;
      t.nathan.page = books[t.nathan.book].pages;
    } else {
      t.nathan.page = clamp(t.nathan.page - 25, 0, books[t.nathan.book].pages);
    }
  }
  if (act === 'nextbook' && t.nathan.book < books.length - 1) {
    t.nathan.book++;
    t.nathan.page = 0;
  }
  save(); render();
}

document.getElementById('versus').addEventListener('click', e => {
  const btn = e.target.closest('[data-act]');
  if (btn && !btn.disabled) tradeAction(btn.dataset.act);
});

document.getElementById('shelves').addEventListener('click', e => {
  const star = e.target.closest('[data-rate]');
  if (star) {
    const [who, id] = star.dataset.rate.split(':');
    const n = Number(e.target.dataset.star);
    if (n) {
      const b = S.shelves[who].find(x => x.id === id);
      b.rating = (b.rating === n) ? 0 : n;   // tap the same star to un-rate
      save(); render();
    }
    return;
  }
  const fin = e.target.closest('[data-fin]');
  if (fin) {
    const [who, id] = fin.dataset.fin.split(':');
    const b = S.shelves[who].find(x => x.id === id);
    b.status = b.status === 'finished' ? 'reading' : 'finished';
    save(); render();
  }
});

document.getElementById('taunt').addEventListener('click', () => {
  S.taunt = (S.taunt + 1) % 3;
  save(); renderTalk();
});

document.getElementById('reset').addEventListener('click', () => {
  S = seed(); save(); render();
});

render();
</script>
</body>
</html>
