<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#191714">
<title>Swap — Jared × Nathan</title>
<style>
  :root{
    --ink:#191714;      /* background: a dim room, not soot */
    --paper:#e9e5dd;    /* text, and the read part of a shelf */
    --dim:#8f887c;      /* labels, metadata */
    --rule:#2c2823;     /* hairlines, and the unread part of a shelf */
    --ribbon:#e55440;   /* the only accent: bookmarks and the lead. 4.9:1 on ink */

    /* spines are narrow, so spine labels are condensed */
    --display:"Arial Narrow","Helvetica Neue Condensed","Liberation Sans Narrow",
              "Nimbus Sans Narrow",sans-serif;
    --body:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    --data:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html{-webkit-text-size-adjust:100%}
  body{
    margin:0;background:var(--ink);color:var(--paper);
    font-family:var(--body);font-size:14px;line-height:1.5;
    -webkit-font-smoothing:antialiased
  }
  main{
    max-width:760px;margin:0 auto;
    padding:22px 24px calc(56px + env(safe-area-inset-bottom))
  }
  button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
  :focus-visible{outline:2px solid var(--ribbon);outline-offset:3px}

  /* type roles ---------------------------------------------------------- */
  .label{
    font-family:var(--display);font-size:11px;font-weight:700;
    letter-spacing:.16em;text-transform:uppercase;color:var(--dim)
  }
  .num{font-family:var(--data);font-variant-numeric:tabular-nums}

  /* header -------------------------------------------------------------- */
  .top{
    display:flex;align-items:baseline;justify-content:space-between;gap:16px;
    padding-bottom:14px;border-bottom:1px solid var(--rule)
  }
  .top .label{color:var(--paper)}
  .top .label em{font-style:normal;color:var(--dim)}
  .reset{font-family:var(--display);font-size:11px;font-weight:700;
    letter-spacing:.16em;text-transform:uppercase;color:var(--dim);white-space:nowrap}
  .reset:hover{color:var(--paper)}

  /* the trade ----------------------------------------------------------- */
  .trade{display:grid;grid-template-columns:1fr 1fr;margin-top:34px}
  .side{display:flex;flex-direction:column;padding-right:30px}
  .side + .side{padding-right:0;padding-left:30px;border-left:1px solid var(--rule)}

  .side .who{display:block;margin-bottom:5px}
  .side .who.leading{color:var(--ribbon)}
  .spine-title{
    font-family:var(--display);font-size:27px;font-weight:700;line-height:1.02;
    letter-spacing:.02em;text-transform:uppercase;margin:0 0 20px
  }

  /* the shelf elevation — the signature ---------------------------------- */
  .shelf-view{
    display:flex;align-items:flex-end;gap:2px;height:48px;
    border-bottom:1px solid var(--paper);padding-bottom:0
  }
  .spine{display:block;flex:1 1 0;height:100%;background:var(--rule)}
  .spine.read{background:var(--paper)}
  .block{display:block;position:relative;height:100%;background:var(--rule)}
  .block .read{display:block;height:100%;background:var(--paper)}
  /* a bookmark sticking out of the top of the book */
  .mark{display:block;position:absolute;top:-9px;bottom:0;width:2px;background:var(--ribbon)}
  .shelf-view > .mark{position:relative;top:0;height:57px;flex:0 0 2px;align-self:flex-end}

  .readout{
    display:flex;align-items:baseline;justify-content:space-between;gap:10px;
    margin-top:11px
  }
  .place{font-family:var(--data);font-size:11px;letter-spacing:.04em;
    text-transform:uppercase;color:var(--dim)}
  .pct{font-family:var(--data);font-size:29px;letter-spacing:-.03em;line-height:1}

  .acts{display:flex;gap:8px;margin-top:20px}
  .act{
    font-family:var(--display);font-size:11px;font-weight:700;letter-spacing:.14em;
    text-transform:uppercase;border:1px solid var(--rule);padding:11px 13px;
    transition:border-color .15s,color .15s
  }
  .act:hover:not(:disabled){border-color:var(--paper)}
  .act.grow{flex:1}
  .act.step{flex:0 0 42px;text-align:center;padding-left:0;padding-right:0}
  .act:disabled{color:var(--rule);border-color:var(--rule);cursor:default}

  /* verdict ------------------------------------------------------------- */
  .verdict{
    display:flex;align-items:baseline;justify-content:space-between;gap:20px;
    margin-top:38px;padding-top:16px;border-top:1px solid var(--rule)
  }
  .verdict p{margin:0;color:var(--dim)}
  .verdict .lead{
    font-family:var(--display);font-weight:700;letter-spacing:.1em;
    text-transform:uppercase;color:var(--ribbon)
  }
  .verdict .gap{font-family:var(--data);color:var(--ribbon)}
  .another{font-family:var(--display);font-size:11px;font-weight:700;
    letter-spacing:.16em;text-transform:uppercase;color:var(--dim);white-space:nowrap}
  .another:hover{color:var(--paper)}

  /* shelves ------------------------------------------------------------- */
  .shelves{display:grid;grid-template-columns:1fr 1fr;margin-top:46px}
  .shelf{padding-right:30px}
  .shelf + .shelf{padding-right:0;padding-left:30px;border-left:1px solid var(--rule)}
  .shelf-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;
    padding-bottom:10px}
  .shelf-head .label{color:var(--paper)}
  .shelf-head .avg{font-family:var(--data);font-size:11px;color:var(--dim)}

  ul{list-style:none;margin:0;padding:0}
  li{border-top:1px solid var(--rule);padding:12px 0}
  .line{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
  .title{font-size:14.5px;font-weight:500;letter-spacing:-.005em}
  .meta{font-family:var(--data);font-size:11px;color:var(--dim);margin-top:3px}

  /* Stars sit in reverse DOM order so hovering one can light the ones to its
     left via the sibling combinator. */
  .stars{display:flex;flex-direction:row-reverse;gap:2px;flex:none;line-height:1}
  .stars button{font-size:13px;color:var(--rule);padding:1px;transition:color .12s}
  .stars button.on{color:var(--paper)}
  .stars button:hover,
  .stars button:hover ~ button{color:var(--dim)}
  .stars button.on:hover,
  .stars button:hover ~ button.on{color:var(--paper)}

  .status{
    font-family:var(--data);font-size:11px;color:var(--dim);flex:none;
    border-bottom:1px dotted var(--rule);padding-bottom:1px;transition:color .15s
  }
  .status:hover{color:var(--paper);border-bottom-color:var(--dim)}
  .status.on{color:var(--paper)}

  footer{margin-top:52px;padding-top:14px;border-top:1px solid var(--rule)}
  footer p{margin:0;font-family:var(--data);font-size:11px;color:var(--dim)}

  @media (max-width:640px){
    main{padding:18px 20px 44px}
    .trade,.shelves{grid-template-columns:1fr}
    .side{padding-right:0}
    .side + .side{padding-left:0;border-left:0;border-top:1px solid var(--rule);
      margin-top:30px;padding-top:30px}
    .shelf{padding-right:0}
    .shelf + .shelf{padding-left:0;border-left:0;margin-top:38px}
    .spine-title{font-size:31px}
    .pct{font-size:33px}
    .verdict{flex-direction:column;align-items:flex-end;gap:10px}
    .verdict p{align-self:stretch}
  }
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main>

  <div class="top">
    <span class="label">Swap №1 <em>· Jared × Nathan</em></span>
    <button class="reset" id="reset">Reset</button>
  </div>

  <section class="trade" id="trade" aria-label="The trade"></section>

  <div class="verdict">
    <p id="talk"></p>
    <button class="another" id="another">Another</button>
  </div>

  <section class="shelves" id="shelves" aria-label="Shelves"></section>

  <footer><p>Demo. Nothing leaves this browser.</p></footer>

</main>

<script>
/* Real counts — the shelf drawing is only honest if these are. */
const SERIES = {
  vinland: { title: 'Vinland Saga', volumes: 27 },
  redrising: { title: 'Red Rising', books: [
    { title: 'Red Rising',   pages: 382 },
    { title: 'Golden Son',   pages: 442 },
    { title: 'Morning Star', pages: 518 }
  ]}
};
const RR_TOTAL = SERIES.redrising.books.reduce((n, b) => n + b.pages, 0);

function seed() {
  return {
    trade: {
      jared:  { volume: 2 },        // Vinland Saga, vol 2 of 27
      nathan: { book: 0, page: 47 } // Red Rising, book 1, p.47
    },
    shelves: {
      jared: [
        { id:'j1', title:'Red Rising',   meta:'Red Rising #1', status:'finished', rating:4 },
        { id:'j2', title:'Golden Son',   meta:'Red Rising #2', status:'finished', rating:5 },
        { id:'j3', title:'Morning Star', meta:'Red Rising #3', status:'reading',  rating:0, page:210, pages:518 },
        { id:'j4', title:'Vinland Saga', meta:"Nathan's pick", status:'reading',  rating:0, swap:true }
      ],
      nathan: [
        { id:'n1', title:'Vinland Saga', meta:'Vol. 1–27, complete', status:'finished', rating:5 },
        { id:'n2', title:'Red Rising',   meta:"Jared's pick",        status:'reading',  rating:0, swap:true }
      ]
    },
    taunt: 0
  };
}

const KEY = 'swap-demo-v2';
let S = load();

function load() {
  try {
    const p = JSON.parse(localStorage.getItem(KEY));
    return (p && p.trade && p.shelves && p.shelves.jared) ? p : seed();
  } catch (e) { return seed(); }
}
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { /* runs in memory */ }
}

/* Both sides are measured as percent of their own series, which is the only
   way a volume count and a page count can sit next to each other. */
const jaredPct = () => S.trade.jared.volume / SERIES.vinland.volumes * 100;
function nathanPages() {
  let n = S.trade.nathan.page;
  for (let i = 0; i < S.trade.nathan.book; i++) n += SERIES.redrising.books[i].pages;
  return n;
}
const nathanPct = () => nathanPages() / RR_TOTAL * 100;
const pct = n => (n > 0 && n < 10 ? n.toFixed(1) : Math.round(n)) + '%';
const clamp = (n, lo, hi) => Math.max(lo, Math.min(hi, n));

/* ---- the shelf elevation ------------------------------------------------
   Jared's series is drawn as 27 volume spines; Nathan's as 3 blocks sized to
   their real page counts. Same width, same baseline, so the fills compare
   directly — and the difference in shape is the point. */
function drawSpines(read, total) {
  let out = '';
  for (let i = 1; i <= total; i++) {
    if (i - 1 === read && read > 0) out += '<i class="mark"></i>';
    out += `<i class="spine${i <= read ? ' read' : ''}"></i>`;
  }
  if (read >= total) out += '<i class="mark"></i>';
  return out;
}
function drawBlocks(bookIdx, page) {
  return SERIES.redrising.books.map((b, i) => {
    const frac = i < bookIdx ? 1 : i > bookIdx ? 0 : page / b.pages;
    const mark = i === bookIdx
      ? `<i class="mark" style="left:calc(${frac * 100}% - 1px)"></i>` : '';
    return `<i class="block" style="flex:${b.pages} 0 0">
              <i class="read" style="width:${frac * 100}%"></i>${mark}
            </i>`;
  }).join('');
}

function renderTrade() {
  const jp = jaredPct(), np = nathanPct();
  /* Below the tie threshold the verdict says nobody leads, so nobody is marked. */
  const tied = Math.abs(jp - np) < TIE;
  const jLead = !tied && jp > np, nLead = !tied && np > jp;
  const v = S.trade.jared.volume, VOLS = SERIES.vinland.volumes;
  const { book, page } = S.trade.nathan;
  const cur = SERIES.redrising.books[book];
  const atEnd = page >= cur.pages;
  const last = book === SERIES.redrising.books.length - 1;
  const next = last ? null : SERIES.redrising.books[book + 1];

  document.getElementById('trade').innerHTML = `
    <div class="side">
      <span class="label who${jLead ? ' leading' : ''}">Jared</span>
      <h2 class="spine-title">Vinland Saga</h2>
      <div class="shelf-view">${drawSpines(v, VOLS)}</div>
      <div class="readout">
        <span class="place">Vol. ${v} of ${VOLS}</span>
        <span class="pct">${pct(jp)}</span>
      </div>
      <div class="acts">
        <button class="act grow" data-act="vol+" ${v >= VOLS ? 'disabled' : ''}>
          ${v >= VOLS ? 'Series finished' : 'Read a volume'}
        </button>
        <button class="act step" data-act="vol-" ${v <= 0 ? 'disabled' : ''}
                aria-label="Undo one volume">&minus;</button>
      </div>
    </div>

    <div class="side">
      <span class="label who${nLead ? ' leading' : ''}">Nathan</span>
      <h2 class="spine-title">${cur.title}</h2>
      <div class="shelf-view">${drawBlocks(book, page)}</div>
      <div class="readout">
        <span class="place">Book ${book + 1} of 3 · p.${page}</span>
        <span class="pct">${pct(np)}</span>
      </div>
      <div class="acts">
        ${atEnd && next
          ? `<button class="act grow" data-act="nextbook">Start ${next.title}</button>`
          : `<button class="act grow" data-act="pg+" ${atEnd ? 'disabled' : ''}>
               ${atEnd ? 'Trilogy finished' : 'Read 25 pages'}</button>`}
        <button class="act step" data-act="pg-" ${page <= 0 && book === 0 ? 'disabled' : ''}
                aria-label="Undo 25 pages">&minus;</button>
      </div>
    </div>`;
}

/* ---- the voice ----------------------------------------------------------
   Everything but the tie reads as a continuation of "<name> leads by N —",
   so those lines start lowercase. */
const TAUNTS = {
  blowout: [
    'this stopped being a race.',
    '{T} finishes sometime after the heat death of the universe.',
    '{L} could start over and still win.'
  ],
  clear: [
    '{T} has some excuses to prepare.',
    '{T} says they read at night. do they though?',
    '{T} has a bookmark and good intentions.'
  ],
  close: [
    'one long bus ride decides this.',
    '{T} is one chapter from taking it back.',
    'too close to talk trash. earn it first.'
  ],
  tied: [
    'Dead even. Somebody do something.',
    'Perfectly tied. Suspicious.',
    'A tie. Equally slow.'
  ]
};
const TIE = 0.5;   // points of series completion, below which it's a dead heat
const bucket = g => g < TIE ? 'tied' : g < 6 ? 'close' : g < 20 ? 'clear' : 'blowout';

function renderVerdict() {
  const jp = jaredPct(), np = nathanPct();
  const gap = Math.abs(jp - np), jLead = jp >= np;
  const L = jLead ? 'Jared' : 'Nathan', T = jLead ? 'Nathan' : 'Jared';
  const pool = TAUNTS[bucket(gap)];
  const line = pool[S.taunt % pool.length].replace('{L}', L).replace('{T}', T);
  const head = gap < TIE
    ? ''
    : `<span class="lead">${L} leads by</span> <span class="gap">${gap.toFixed(1)}</span> — `;
  document.getElementById('talk').innerHTML = head + line;
}

/* ---- shelves ------------------------------------------------------------ */
function renderShelves() {
  document.getElementById('shelves').innerHTML = ['jared', 'nathan'].map(who => {
    const list = S.shelves[who];
    const rated = list.filter(b => b.rating > 0);
    const avg = rated.length
      ? (rated.reduce((n, b) => n + b.rating, 0) / rated.length).toFixed(1) : '–';

    const rows = list.map(b => {
      /* The two swap rows read their position off the trade, so the shelf and
         the card can never disagree. */
      let title = b.title, meta = b.meta;
      if (b.swap && who === 'jared') {
        meta += ` · vol. ${S.trade.jared.volume} of ${SERIES.vinland.volumes}`;
      } else if (b.swap && who === 'nathan') {
        title = SERIES.redrising.books[S.trade.nathan.book].title;
        meta += ` · book ${S.trade.nathan.book + 1}, p.${S.trade.nathan.page}`;
      } else if (b.status === 'reading' && b.page) {
        meta += ` · p.${b.page} of ${b.pages}`;
      }
      const stars = [5, 4, 3, 2, 1].map(n =>
        `<button class="${n <= b.rating ? 'on' : ''}" data-rate="${who}:${b.id}:${n}"
           aria-label="Rate ${n} of 5">${n <= b.rating ? '★' : '☆'}</button>`).join('');
      return `
        <li>
          <div class="line">
            <span class="title">${title}</span>
            <span class="stars">${stars}</span>
          </div>
          <div class="line">
            <span class="meta">${meta}</span>
            <button class="status${b.status === 'finished' ? ' on' : ''}"
                    data-fin="${who}:${b.id}">${b.status}</button>
          </div>
        </li>`;
    }).join('');

    const name = who === 'jared' ? 'Jared' : 'Nathan';
    return `
      <div class="shelf">
        <div class="shelf-head">
          <span class="label">${name}'s shelf</span>
          <span class="avg">avg ${avg}</span>
        </div>
        <ul>${rows}</ul>
      </div>`;
  }).join('');
}

const render = () => { renderTrade(); renderVerdict(); renderShelves(); };

/* ---- actions ------------------------------------------------------------ */
document.getElementById('trade').addEventListener('click', e => {
  const btn = e.target.closest('[data-act]');
  if (!btn || btn.disabled) return;
  const t = S.trade, books = SERIES.redrising.books;

  if (btn.dataset.act === 'vol+') t.jared.volume = clamp(t.jared.volume + 1, 0, SERIES.vinland.volumes);
  if (btn.dataset.act === 'vol-') t.jared.volume = clamp(t.jared.volume - 1, 0, SERIES.vinland.volumes);
  if (btn.dataset.act === 'pg+')  t.nathan.page = clamp(t.nathan.page + 25, 0, books[t.nathan.book].pages);
  if (btn.dataset.act === 'pg-') {
    if (t.nathan.page <= 0 && t.nathan.book > 0) {
      t.nathan.book--;
      t.nathan.page = books[t.nathan.book].pages;   // step back over the seam
    } else {
      t.nathan.page = clamp(t.nathan.page - 25, 0, books[t.nathan.book].pages);
    }
  }
  if (btn.dataset.act === 'nextbook' && t.nathan.book < books.length - 1) {
    t.nathan.book++;
    t.nathan.page = 0;
  }
  save(); render();
});

document.getElementById('shelves').addEventListener('click', e => {
  const star = e.target.closest('[data-rate]');
  if (star) {
    const [who, id, n] = star.dataset.rate.split(':');
    const b = S.shelves[who].find(x => x.id === id);
    b.rating = b.rating === +n ? 0 : +n;   // tap the same star to clear
    save(); render();
    return;
  }
  const fin = e.target.closest('[data-fin]');
  if (fin) {
    const [who, id] = fin.dataset.fin.split(':');
    const b = S.shelves[who].find(x => x.id === id);
    b.status = b.status === 'finished' ? 'reading' : 'finished';
    save(); render();
  }
});

document.getElementById('another').addEventListener('click', () => {
  S.taunt = (S.taunt + 1) % 3;
  save(); renderVerdict();
});
document.getElementById('reset').addEventListener('click', () => {
  S = seed(); save(); render();
});

render();
</script>
</body>
</html>
